name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Reuses the token GitHub Actions provisions automatically for every
          # workflow run (repo-scoped, no secret setup required) so the build's
          # live GitHub API calls don't hit the 60/hr anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # RainbowKit's getDefaultConfig throws at render time if this is
          # empty, and every page prerenders through the wallet provider tree
          # -- so the build needs *a* non-empty value, not a working one. This
          # is a placeholder, not a real WalletConnect project id; it's fine
          # because CI never exercises the actual WalletConnect handshake.
          # (It's also documented as public-by-design in .env.example, so
          # there's nothing sensitive about hardcoding a value here either way.)
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: "00000000000000000000000000000000"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: e2e smoke tests
        run: npm run test:e2e
        env:
          # /compare and /projects are server-rendered on demand, so the e2e
          # server refetches GitHub data live even though the build already
          # ran -- same rate-limit reasoning as the Build step above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
